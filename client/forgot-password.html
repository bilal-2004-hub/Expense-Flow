<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — ExpenseFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── AUTH LAYOUT ── */
  .auth-page {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  /* ── LEFT PANEL ── */
  .auth-panel {
    position: relative;
    background: linear-gradient(145deg, #1e40af 0%, #2563eb 45%, #3b82f6 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px;
    overflow: hidden;
    color: #fff;
  }
  .auth-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(30,64,175,0.5) 0%, transparent 50%);
  }
  .auth-panel-logo {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-heading);
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
  }
  .auth-panel-logo .logo-mark {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(8px);
  }
  .auth-panel-content {
    position: relative;
    z-index: 1;
  }
  .auth-panel-content h2 {
    font-size: clamp(1.8rem, 2.5vw, 2.4rem);
    color: #fff;
    line-height: 1.25;
    margin-bottom: 16px;
  }
  .auth-panel-content p {
    color: rgba(255,255,255,0.75);
    font-size: 1rem;
    max-width: 380px;
    line-height: 1.7;
    margin-bottom: 36px;
  }

  /* Orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.3;
    pointer-events: none;
  }
  .orb1 { width: 300px; height: 300px; background: #93c5fd; top: -80px; right: -80px; }
  .orb2 { width: 200px; height: 200px; background: #1d4ed8; bottom: 100px; left: -60px; }

  /* ── RIGHT PANEL (FORM) ── */
  .auth-form-side {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 48px 32px;
    overflow-y: auto;
  }
  .auth-form-box {
    width: 100%;
    max-width: 420px;
  }
  .auth-form-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .auth-form-header h1 {
    font-size: 1.9rem;
    margin-bottom: 8px;
  }
  .auth-form-header p {
    color: var(--text-secondary);
    font-size: 0.95rem;
  }
  .auth-form-header p a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
  }
  .auth-form-header p a:hover { text-decoration: underline; }

  /* Form Card */
  .auth-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(15,23,42,0.05);
  }

  /* Form fields */
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 7px;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap i.input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 0.9rem;
    pointer-events: none;
  }
  .input-wrap input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text-primary);
    transition: var(--transition);
    outline: none;
  }
  .input-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    background: var(--card);
  }
  .input-wrap input.error {
    border-color: var(--expense);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
  }
  .field-error {
    font-size: 0.78rem;
    color: var(--expense);
    margin-top: 5px;
    display: none;
    align-items: center;
    gap: 4px;
  }
  .field-error.show { display: flex; }

  /* Submit button */
  .auth-submit {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: var(--gradient-primary);
    color: #fff;
    font-size: 0.97rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .auth-submit:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md), 0 0 0 4px rgba(37,99,235,0.15);
  }
  .auth-submit:active { transform: translateY(0); }
  .auth-submit .btn-spinner {
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .auth-submit.loading .btn-text { display: none; }
  .auth-submit.loading .btn-spinner { display: block; }

  /* Alert */
  .auth-alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.88rem;
    margin-bottom: 20px;
    display: none;
    align-items: center;
    gap: 10px;
    border: 1px solid;
  }
  .auth-alert.show { display: flex; }
  .auth-alert.error {
    background: #fef2f2;
    color: #b91c1c;
    border-color: #fca5a5;
  }
  .auth-alert.success {
    background: #f0fdf4;
    color: #15803d;
    border-color: #86efac;
  }
  .auth-alert.info {
    background: #eff6ff;
    color: #1d4ed8;
    border-color: #bfdbfe;
  }

  /* OTP Banner styling (deprecated/hidden) */
  .otp-reveal {
    display: none !important;
  }

  .input-wrap .toggle-pw {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.9rem;
    padding: 2px;
    transition: var(--transition);
  }
  .input-wrap .toggle-pw:hover { color: var(--primary); }


  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .auth-page { grid-template-columns: 1fr; }
    .auth-panel { display: none; }
    .auth-form-side { padding: 32px 20px; }
  }
</style>
</head>
<body>

<div class="auth-page">

  <!-- ====== LEFT BRAND PANEL ====== -->
  <div class="auth-panel">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <a href="index.html" class="auth-panel-logo">
      <span class="logo-mark"><i class="fa-solid fa-wave-square"></i></span>
      ExpenseFlow
    </a>

    <div class="auth-panel-content">
      <h2>Secure Password Reset</h2>
      <p>Follow a few simple steps to verify your identity and restore access to your account quickly and safely.</p>
    </div>
  </div>

  <!-- ====== RIGHT FORM PANEL ====== -->
  <div class="auth-form-side">
    <div class="auth-form-box">

      <div class="auth-form-header">
        <h1>Forgot Password</h1>
        <p>Remembered your password? <a href="login.html">Login instead</a></p>
      </div>

      <div class="auth-card">

        <!-- Alert messages -->
        <div class="auth-alert error" id="reset-alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="reset-alert-msg"></span>
        </div>



        <!-- FORM STEP 1: Enter Email -->
        <form id="step1-form">
          <div class="form-group">
            <label for="reset-email">Email address</label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope input-icon"></i>
              <input type="email" id="reset-email" placeholder="you@example.com" required>
            </div>
            <div class="field-error" id="email-error"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
          </div>

          <button type="submit" class="auth-submit" id="step1-btn">
            <span class="btn-text"><i class="fa-solid fa-paper-plane"></i> Send OTP Code</span>
            <div class="btn-spinner"></div>
          </button>
        </form>

        <!-- FORM STEP 2: Verify OTP (hidden by default) -->
        <form id="step2-form" style="display:none;">
          <div class="form-group">
            <label for="otp-code">One-Time Password (OTP)</label>
            <div class="input-wrap">
              <i class="fa-solid fa-key input-icon"></i>
              <input type="text" id="otp-code" placeholder="Enter 6-digit OTP" maxlength="6" required>
            </div>
            <div class="field-error" id="otp-error"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
          </div>

          <div style="margin: -10px 0 20px 0; text-align: right; font-size: 0.85rem;">
            <span id="cooldown-text" style="color: var(--text-secondary);">
              Didn't receive the OTP? <button type="button" id="resend-otp-btn" style="background:none; border:none; color:var(--primary); font-weight:600; cursor:pointer;" disabled>Resend OTP in 60s</button>
            </span>
          </div>

          <button type="submit" class="auth-submit" id="step2-btn">
            <span class="btn-text"><i class="fa-solid fa-circle-check"></i> Verify OTP Code</span>
            <div class="btn-spinner"></div>
          </button>
        </form>

        <!-- FORM STEP 3: Reset Password (hidden by default) -->
        <form id="step3-form" style="display:none;">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="new-password" placeholder="Create a strong password" required>
              <button type="button" class="toggle-pw" id="toggle-pw1" aria-label="Show password">
                <i class="fa-solid fa-eye" id="pw1-icon"></i>
              </button>
            </div>
            <div class="field-error" id="pw-error"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="confirm-password" placeholder="Confirm new password" required>
              <button type="button" class="toggle-pw" id="toggle-pw2" aria-label="Show confirm password">
                <i class="fa-solid fa-eye" id="pw2-icon"></i>
              </button>
            </div>
            <div class="field-error" id="confirm-error"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
          </div>

          <button type="submit" class="auth-submit" id="step3-btn">
            <span class="btn-text"><i class="fa-solid fa-shield-halved"></i> Reset Password</span>
            <div class="btn-spinner"></div>
          </button>
        </form>

      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script>
  let emailAddress = '';
  let resetToken = '';
  let cooldownTimer = null;

  // ── Alert helpers ──
  function showAlert(msg, type = 'error') {
    const alert = document.getElementById('reset-alert');
    document.getElementById('reset-alert-msg').textContent = msg;
    alert.className = `auth-alert ${type} show`;
  }

  function hideAlert() {
    const alert = document.getElementById('reset-alert');
    if (alert) alert.classList.remove('show');
  }

  // ── Cooldown timer ──
  function startCooldown() {
    const btn = document.getElementById('resend-otp-btn');
    let timeLeft = 60;
    btn.disabled = true;
    btn.textContent = `Resend OTP in ${timeLeft}s`;

    if (cooldownTimer) clearInterval(cooldownTimer);

    cooldownTimer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(cooldownTimer);
        btn.disabled = false;
        btn.textContent = 'Resend OTP';
      } else {
        btn.textContent = `Resend OTP in ${timeLeft}s`;
      }
    }, 1000);
  }

  // ── Step 1: Request OTP ──
  document.getElementById('step1-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    hideAlert();

    const email = document.getElementById('reset-email').value.trim();
    if (!email) return;

    emailAddress = email;
    const btn = document.getElementById('step1-btn');
    btn.classList.add('loading');

    try {
      const data = await API.post('/auth/forgot-password', { email });
      btn.classList.remove('loading');

      showAlert(data.message || 'If an account exists with this email, an OTP has been sent.', 'info');
      document.getElementById('step1-form').style.display = 'none';
      document.getElementById('step2-form').style.display = 'block';
      startCooldown();
    } catch (err) {
      btn.classList.remove('loading');
      showAlert(err.message || 'Error requesting password reset.');
    }
  });

  // ── Resend OTP ──
  document.getElementById('resend-otp-btn').addEventListener('click', async function() {
    hideAlert();
    const btn = document.getElementById('resend-otp-btn');
    btn.disabled = true;

    try {
      const data = await API.post('/auth/resend-otp', { email: emailAddress });
      showAlert(data.message || 'A new OTP has been dispatched to your email.', 'info');
      startCooldown();
    } catch (err) {
      showAlert(err.message || 'Error resending OTP.');
      btn.disabled = false;
    }
  });

  // ── Step 2: Verify OTP ──
  document.getElementById('step2-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    hideAlert();

    const otp = document.getElementById('otp-code').value.trim();
    if (!otp) return;

    const btn = document.getElementById('step2-btn');
    btn.classList.add('loading');

    try {
      const data = await API.post('/auth/verify-otp', { email: emailAddress, otp });
      btn.classList.remove('loading');

      resetToken = data.reset_token;
      showAlert('OTP verified successfully! Please enter your new password.', 'success');
      document.getElementById('step2-form').style.display = 'none';
      document.getElementById('step3-form').style.display = 'block';
      if (cooldownTimer) clearInterval(cooldownTimer);
    } catch (err) {
      btn.classList.remove('loading');
      showAlert(err.message || 'Invalid or expired OTP.');
    }
  });

  // ── Step 3: Reset Password ──
  document.getElementById('step3-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    hideAlert();

    const password = document.getElementById('new-password').value;
    
    if (password.length < 6) {
      showAlert('Password must be at least 6 characters long.');
      return;
    }
    
    if (password !== document.getElementById('confirm-password').value) {
      showAlert('Passwords do not match.');
      return;
    }

    const btn = document.getElementById('step3-btn');
    btn.classList.add('loading');

    try {
      const data = await API.post('/auth/reset-password', {
        email: emailAddress,
        reset_token: resetToken,
        password
      });
      btn.classList.remove('loading');

      showAlert('Password reset successfully! Redirecting to login...', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    } catch (err) {
      btn.classList.remove('loading');
      showAlert(err.message || 'Error resetting password.');
    }
  });

  // ── Toggle password visibility ──
  function setupToggle(btnId, inputId, iconId) {
    document.getElementById(btnId).addEventListener('click', () => {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      icon.className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    });
  }
  setupToggle('toggle-pw1', 'new-password', 'pw1-icon');
  setupToggle('toggle-pw2', 'confirm-password', 'pw2-icon');
</script>
</body>
</html>
