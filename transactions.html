<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — ExpenseFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="transactions">
<div class="overlay-scrim"></div>

<div class="app-shell">
  <aside class="app-sidebar">
    <button class="sidebar-close"><i class="fa-solid fa-xmark"></i></button>
    <a href="index.html" class="logo"><span class="logo-mark"><i class="fa-solid fa-wave-square"></i></span>ExpenseFlow</a>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fa-solid fa-grip"></i> Dashboard</a>
      <a href="transactions.html"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transactions</a>
      <a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a>
      <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <a href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
    </div>
  </aside>

  <main class="app-main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div class="greeting">
          <h1>Transactions</h1>
          <p id="tx-count">0 transactions</p>
        </div>
      </div>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="tx-search" placeholder="Search by title or category...">
      </div>
      <div class="topbar-right">
        <button class="icon-btn"><i class="fa-solid fa-bell"></i><span class="badge">3</span></button>
        <a href="settings.html" class="profile-chip">
          <div class="avatar-circle" id="profile-initials">AM</div>
          <span id="topbar-user-name">Alex Morgan</span>
        </a>
      </div>
    </div>

    <!-- ===== BALANCE SUMMARY STRIP ===== -->
    <div class="tx-balance-strip" id="tx-balance-strip">
      <div class="tx-bal-card income">
        <span class="tx-bal-label"><i class="fa-solid fa-arrow-down"></i> Total Income</span>
        <span class="tx-bal-value" id="tx-bal-income">$0.00</span>
      </div>
      <div class="tx-bal-card expense">
        <span class="tx-bal-label"><i class="fa-solid fa-arrow-up"></i> Total Expenses</span>
        <span class="tx-bal-value" id="tx-bal-expense">$0.00</span>
      </div>
      <div class="tx-bal-card balance">
        <span class="tx-bal-label"><i class="fa-solid fa-wallet"></i> Current Balance</span>
        <span class="tx-bal-value" id="tx-bal-balance">$0.00</span>
      </div>
    </div>

    <div class="tx-toolbar">
      <div class="filter-chips">
        <button type="button" class="filter-chip active" data-range="all">All</button>
        <button type="button" class="filter-chip" data-range="today">Today</button>
        <button type="button" class="filter-chip" data-range="week">Week</button>
        <button type="button" class="filter-chip" data-range="month">Month</button>
        <button type="button" class="filter-chip" data-range="year">Year</button>
      </div>
      <div class="tx-filters-right">
        <select id="category-filter"></select>
        <select id="sort-filter">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="amount-desc">Amount: high to low</option>
          <option value="amount-asc">Amount: low to high</option>
        </select>
      </div>
    </div>

    <div class="tx-table-wrap">
      <table class="tx-table">
        <thead>
          <tr>
            <th>Date</th><th>Title</th><th>Category</th><th>Amount</th><th>Type</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tx-table-body"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Floating Add Button -->
<button class="fab" id="fab-add-tx" aria-label="Add transaction"><i class="fa-solid fa-plus"></i></button>

<!-- ================= ADD/EDIT MODAL ================= -->
<div class="modal-overlay" id="tx-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="tx-modal-title">Add Transaction</h3>
      <button class="modal-close" data-close-modal="tx-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="tx-form">
      <div class="type-toggle" style="margin-bottom:16px;">
        <button type="button" class="income" data-type="income">Income</button>
        <button type="button" class="active expense" data-type="expense">Expense</button>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>Title</label>
        <input type="text" name="title" placeholder="e.g. Grocery run" required>
      </div>
      <div class="form-row" style="margin-bottom:14px;">
        <div class="form-group">
          <label>Amount</label>
          <input type="number" name="amount" step="0.01" placeholder="0.00" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category" class="category-select" required></select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>Date</label>
        <input type="date" name="date" id="tx-form-date" required>
      </div>
      <div class="form-group" style="margin-bottom:6px;">
        <label>Notes (optional)</label>
        <textarea name="notes" rows="2" placeholder="Add a note..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-close-modal="tx-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Transaction</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= DELETE CONFIRM MODAL ================= -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box small">
    <div class="warn-icon"><i class="fa-solid fa-trash"></i></div>
    <h3>Delete this transaction?</h3>
    <p style="color:var(--text-secondary);font-size:0.9rem;margin-top:8px;">This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" data-close-modal="delete-modal">Cancel</button>
      <button class="btn btn-primary" id="confirm-delete-btn" style="background:var(--expense)">Delete</button>
    </div>
  </div>
</div>

<div class="toast-container"></div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
